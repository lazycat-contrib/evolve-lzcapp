version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: evolve

build:
  toolchains: []
  run_buildscript: false

images:
  # dockers-x/evolve publishes `latest` (upstream has no release tags), so the
  # version source is the mutable channel with digest comparison + patch bump.
  - id: evolve
    target: service
    service: evolve
    source: ghcr.io/dockers-x/evolve
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Evolve
    summary: "网页放置类进化游戏：从原生质走向星空"

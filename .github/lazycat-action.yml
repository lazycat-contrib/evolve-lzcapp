version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: evolve

build:
  toolchains: []
  run_buildscript: false

images:
  # dockers-x/evolve publishes immutable `v<package.json version>` tags from
  # upstream source. Repeated upstream patches with the same version tag reuse
  # the same tag, but the Action still compares the selected digest.
  - id: evolve
    target: service
    service: evolve
    source: ghcr.io/dockers-x/evolve
    channel: stable
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    version_template: '{version}'
    delivery:
      # Immutable version tags support mirror delivery: the Manifest references
      # the accelerated image and the Action verifies the digests match.
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Evolve
    summary: "网页放置类进化游戏：从原生质走向星空"
